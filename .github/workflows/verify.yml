name: verify
on:
  push:
    branches: [main, 'review/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Headless verification (syntax + manifest + router cascade)
        run: node verify.mjs
